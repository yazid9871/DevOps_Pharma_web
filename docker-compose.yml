x-robot: &robot-defaults
  image: ${ROBOT_IMAGE:?ROBOT_IMAGE is required}
  entrypoint: ["/run_robot.sh"]
  shm_size: "1gb"
  mem_limit: "1g"
  restart: "no"

services:
  admin-rapports:
    <<: *robot-defaults
    profiles: ["admin-heavy-reports"]
    environment:
      MODULE_PATH: /tests/TestSuite/ADMIN_ACCOUNT/Rapports
    volumes:
      - ./results/admin/rapports:/tests/results

  admin-ventes:
    <<: *robot-defaults
    profiles: ["admin-heavy-sales"]
    environment:
      MODULE_PATH: /tests/TestSuite/ADMIN_ACCOUNT/Ventes
    volumes:
      - ./results/admin/ventes:/tests/results

  admin-achats:
