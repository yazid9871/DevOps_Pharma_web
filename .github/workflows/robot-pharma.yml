name: Robot Pharma Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pharma-robot
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build:
    name: Build test image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - group: admin-heavy-reports
            role: admin
            label: ADMIN - Rapports (320 tests)
          - group: admin-heavy-sales
            role: admin
            label: ADMIN - Ventes (207 tests)
          - group: admin-heavy-purchases
            role: admin
            label: ADMIN - Achats (116 tests)
          - group: admin-medium
            role: admin
            label: ADMIN - Confreres et Stock (175 tests)
          - group: admin-light
            role: admin
            label: ADMIN - Modules legers (241 tests)
          - group: user-heavy-reports
            role: user
            label: USER - Rapports (320 tests)
          - group: user-heavy-sales
            role: user
            label: USER - Ventes (207 tests)
          - group: user-heavy-purchases
            role: user
            label: USER - Achats (107 tests)
          - group: user-medium
            role: user
            label: USER - Confreres et Stock (175 tests)
          - group: user-light
            role: user
            label: USER - Modules legers (240 tests)
    env:
      ROBOT_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull test image
        run: docker pull "$ROBOT_IMAGE"
      - name: Run Robot tests (non-blocking)
        run: |
          set +e
          docker compose --profile "${{ matrix.group }}" up --no-color
          exit 0
      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-${{ matrix.group }}-reports
          path: results/${{ matrix.role }}/
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Generate Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Robot artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: robot-*-reports
          path: downloaded-artifacts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.29.0
          wget -q "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf "allure-${ALLURE_VERSION}.tgz"
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Generate merged Allure report
        run: |
          mapfile -t ALLURE_DIRS < <(find downloaded-artifacts -type d -name allure-results)
          if [ "${#ALLURE_DIRS[@]}" -eq 0 ]; then
            echo "::warning::No Allure results were found"
            exit 0
          fi
          allure generate "${ALLURE_DIRS[@]}" --output allure-report --clean
      - name: Create single-file Allure report
        if: always()
        run: |
          if [ -d allure-report ]; then
            python -m pip install allure-combine
            allure-combine allure-report --dest allure-report
            mkdir -p allure-single
            if [ -f allure-report/complete.html ]; then
              cp allure-report/complete.html allure-single/index.html
            elif [ -f allure-report/index.html ]; then
              cp allure-report/index.html allure-single/index.html
            fi
          fi
      - name: Upload merged Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-single/index.html
          if-no-files-found: warn
          retention-days: 30
      - name: Delete temporary Robot artifacts
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const run_id = context.runId;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id, per_page: 100}
            );

            for (const artifact of artifacts) {
              if (artifact.name.startsWith('robot-') || artifact.name.endsWith('.dockerbuild')) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
              }
            }
