name: Robot Pharma Tests

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Compte à tester"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - admin
          - user
          - freemium

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pharma-robot
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build:
    name: Build test image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  discover:
    name: Discover test folders
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        shell: bash
        run: |
          set -euo pipefail

          selected="${{ github.event_name == 'workflow_dispatch' && inputs.account || 'all' }}"
          matrix_file="$(mktemp)"

          python - "$selected" > "$matrix_file" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          selected = sys.argv[1]
          accounts = {
              "admin": "ADMIN_ACCOUNT",
              "user": "USER_ACCOUNT",
              "freemium": "FREEMIUM_ACCOUNT",
          }

          def slug(value):
              value = value.lower()
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-") or "tests"

          def module_path(account, module):
              return f"/tests/TestSuite/{account}/{module}"

          def add_group(role, account, label, modules):
              existing_modules = [
                  module
                  for module in modules
                  if (Path("TestSuite") / account / module).is_dir()
              ]
              if not existing_modules:
                  return

              group_slug = slug(label)
              include.append({
                  "role": role,
                  "account": account,
                  "modules": "|".join(existing_modules),
                  "module_paths": "|".join(module_path(account, module) for module in existing_modules),
                  "result_path": f"results/{role}/{group_slug}",
                  "artifact": f"robot-{role}-{group_slug}-reports",
                  "label": f"{role.upper()} - {label}",
              })

          include = []
          for role, account in accounts.items():
              if selected not in ("all", role):
                  continue

              account_dir = Path("TestSuite") / account
              if not account_dir.is_dir():
                  continue

              module_names = sorted(p.name for p in account_dir.iterdir() if p.is_dir())
              core_groups = {
                  "Rapports": ["Rapports"],
                  "Ventes": ["Ventes"],
                  "Achats": ["Achats"],
                  "Confreres et Stock": ["Confrères", "Confreres", "Stock"],
              }
              grouped_modules = {
                  module
                  for modules in core_groups.values()
                  for module in modules
              }

              for label, modules in core_groups.items():
                  add_group(role, account, label, modules)

              light_modules = [
                  module
                  for module in module_names
                  if module not in grouped_modules
              ]
              add_group(role, account, "Modules legers", light_modules)

          print(json.dumps({"include": include}, ensure_ascii=False))
          PY

          echo "matrix=$(cat "$matrix_file")" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.label }}
    needs: [build, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      ROBOT_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull test image
        run: docker pull "$ROBOT_IMAGE"
      - name: Run Robot tests (non-blocking)
        run: |
          set +e
          mkdir -p "${{ matrix.result_path }}"
          IFS='|' read -ra MODULE_PATHS <<< "${{ matrix.module_paths }}"
          for MODULE_PATH in "${MODULE_PATHS[@]}"; do
            docker run --rm \
              --shm-size=3g \
              --memory=6g \
              -e MODULE_PATH="$MODULE_PATH" \
              -v "$PWD/${{ matrix.result_path }}:/tests/results" \
              "$ROBOT_IMAGE"
          done
          exit 0
      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.result_path }}/
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Generate Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Robot artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: robot-*-reports
          path: downloaded-artifacts
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.29.0
          wget -q "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf "allure-${ALLURE_VERSION}.tgz"
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Generate merged Allure report
        run: |
          mkdir -p merged-allure-results
          mapfile -t ALLURE_DIRS < <(find downloaded-artifacts -type d -name allure-results)
          if [ "${#ALLURE_DIRS[@]}" -eq 0 ]; then
            echo "::warning::No Allure results were found"
            exit 0
          fi
          for allure_dir in "${ALLURE_DIRS[@]}"; do
            find "$allure_dir" -maxdepth 1 -type f ! -name categories.json -exec cp {} merged-allure-results/ \;
          done
          cp ci/allure-categories.json merged-allure-results/categories.json
          allure generate merged-allure-results --output allure-report --clean
      - name: Create single-file Allure report
        if: always()
        run: |
          if [ -d allure-report ]; then
            python -m pip install allure-combine
            allure-combine allure-report --dest allure-report
            mkdir -p allure-single
            if [ -f allure-report/complete.html ]; then
              cp allure-report/complete.html allure-single/index.html
            elif [ -f allure-report/index.html ]; then
              cp allure-report/index.html allure-single/index.html
            fi
          fi
      - name: Upload merged Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-single/index.html
          if-no-files-found: warn
          retention-days: 30
      - name: Delete temporary Robot artifacts
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const run_id = context.runId;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id, per_page: 100}
            );

            for (const artifact of artifacts) {
              if (artifact.name.startsWith('robot-') || artifact.name.endsWith('.dockerbuild')) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
              }
            }
