name: Robot Admin Achats

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  admin-achats:
    name: ADMIN_ACCOUNT Achats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install Geckodriver
        uses: browser-actions/setup-geckodriver@latest

      - name: Add Firefox to PATH
        run: echo "$(dirname '${{ steps.setup-firefox.outputs.firefox-path }}')" >> "$GITHUB_PATH"

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check test environment
        run: |
          python --version
          robot --version
          xvfb-run -a '${{ steps.setup-firefox.outputs.firefox-path }}' --version
          geckodriver --version

      - name: Run Robot tests
        run: xvfb-run -a robot -d results/admin-achats TestSuite/ADMIN_ACCOUNT/Achats

      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-admin-achats-reports
          path: results/admin-achats
          if-no-files-found: warn
