name: Robot Admin Achats

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  admin-achats:
    name: ${{ matrix.account }} ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Achats
            slug: achats
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Assistant_Marketplace
            slug: assistant-marketplace
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Clients
            slug: clients
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Confrères
            slug: confreres
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Fournisseurs
            slug: fournisseurs
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Marketing
            slug: marketing
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Organismes
            slug: organismes
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Paramètres
            slug: parametres
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Produits
            slug: produits
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Rapports
            slug: rapports
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Stock
            slug: stock
          - account: ADMIN_ACCOUNT
            account_slug: admin
            module: Ventes
            slug: ventes
          - account: USER_ACCOUNT
            account_slug: user
            module: Achats
            slug: achats
          - account: USER_ACCOUNT
            account_slug: user
            module: Assistant_Marketplace
            slug: assistant-marketplace
          - account: USER_ACCOUNT
            account_slug: user
            module: Clients
            slug: clients
          - account: USER_ACCOUNT
            account_slug: user
            module: Confrères
            slug: confreres
          - account: USER_ACCOUNT
            account_slug: user
            module: Fournisseurs
            slug: fournisseurs
          - account: USER_ACCOUNT
            account_slug: user
            module: Marketing
            slug: marketing
          - account: USER_ACCOUNT
            account_slug: user
            module: Organismes
            slug: organismes
          - account: USER_ACCOUNT
            account_slug: user
            module: Paramètres
            slug: parametres
          - account: USER_ACCOUNT
            account_slug: user
            module: Produits
            slug: produits
          - account: USER_ACCOUNT
            account_slug: user
            module: Rapports
            slug: rapports
          - account: USER_ACCOUNT
            account_slug: user
            module: Stock
            slug: stock
          - account: USER_ACCOUNT
            account_slug: user
            module: Ventes
            slug: ventes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --tag pharma-robot-tests .

      - name: Run Robot tests (non-blocking)
        run: |
          mkdir -p "results/${{ matrix.slug }}"
          set +e
          docker run --rm \
            --shm-size=1g \
            --volume "${PWD}/results/${{ matrix.slug }}:/tests/results" \
            --env MODULE_PATH="/tests/TestSuite/${{ matrix.account }}/${{ matrix.module }}" \
            pharma-robot-tests
          robot_exit_code=$?
          echo "## Robot ${{ matrix.account }} - ${{ matrix.module }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Robot Framework exit code: $robot_exit_code" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-${{ matrix.account_slug }}-${{ matrix.slug }}-reports
          path: results/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14
