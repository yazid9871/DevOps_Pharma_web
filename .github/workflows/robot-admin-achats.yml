name: Robot Admin Achats

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  admin-achats:
    name: ADMIN_ACCOUNT Achats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --tag pharma-robot-tests .

      - name: Run Robot tests
        run: |
          mkdir -p results/admin-achats
          docker run --rm \
            --shm-size=1g \
            --volume "${PWD}/results/admin-achats:/tests/results" \
            --env MODULE_PATH=/tests/TestSuite/ADMIN_ACCOUNT/Achats \
            pharma-robot-tests

      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-admin-achats-reports
          path: results/admin-achats
          if-no-files-found: warn
          retention-days: 14
